<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1000 800"><defs><linearGradient id="bgGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="100%" stop-color="#080c14"/></linearGradient><linearGradient id="webGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".15"/><stop offset="100%" stop-color="#1d4ed8" stop-opacity=".15"/></linearGradient><linearGradient id="proxyGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".15"/><stop offset="100%" stop-color="#6d28d9" stop-opacity=".15"/></linearGradient><linearGradient id="registryGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#10b981" stop-opacity=".15"/><stop offset="100%" stop-color="#059669" stop-opacity=".15"/></linearGradient><linearGradient id="awsGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f90" stop-opacity=".15"/><stop offset="100%" stop-color="#cc7a00" stop-opacity=".15"/></linearGradient><linearGradient id="azureGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0078d4" stop-opacity=".15"/><stop offset="100%" stop-color="#005a9e" stop-opacity=".15"/></linearGradient><linearGradient id="gcpGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#34a853" stop-opacity=".15"/><stop offset="100%" stop-color="#25823c" stop-opacity=".15"/></linearGradient><linearGradient id="sideGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1f2937" stop-opacity=".4"/><stop offset="100%" stop-color="#111827" stop-opacity=".4"/></linearGradient><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="6" refY="5" viewBox="0 0 10 10"><path fill="#4b5563" d="M 0 1.5 L 8 5 L 0 8.5 z"/></marker></defs><style>.subtitle,.title{font-family:&apos;Inter&apos;,system-ui,-apple-system,sans-serif;text-anchor:middle}.title{font-size:24px;font-weight:800;fill:#f3f4f6;letter-spacing:.5px}.subtitle{font-size:13px;fill:#9ca3af}.box-title{font-size:15px;font-weight:700;fill:#f3f4f6}.box-text,.box-title,.side-title{font-family:&apos;Inter&apos;,system-ui,-apple-system,sans-serif}.box-text{font-size:12px;fill:#d1d5db;line-height:1.5}.side-title{font-size:14px;font-weight:700;fill:#9ca3af}</style><rect width="1000" height="800" fill="url(#bgGrad)"/><rect width="1000" height="800" fill="none" stroke="#1f2937" stroke-width="1"/><text x="500" y="45" class="title">Harshify Unified Multi-Cloud Architecture</text><text x="500" y="68" class="subtitle">Clean, schema-driven multi-cloud local runtime console</text><rect width="160" height="280" x="25" y="220" fill="url(#sideGrad)" stroke="#374151" stroke-width="1.5" rx="12"/><text x="40" y="250" class="side-title">Principles</text><g class="box-text"><text y="0" transform="translate(40, 275)">• UI doesn&apos;t know clouds</text><text y="24" transform="translate(40, 275)">• Proxy doesn&apos;t know</text><text y="40" transform="translate(40, 275)">internal runtimes</text><text y="64" transform="translate(40, 275)">• SPI defines contracts</text><text y="88" transform="translate(40, 275)">• Adapters translate</text><text y="112" transform="translate(40, 275)">• Harshify runtimes</text><text y="128" transform="translate(40, 275)">execute behavior</text></g><rect width="160" height="280" x="815" y="220" fill="url(#sideGrad)" stroke="#374151" stroke-width="1.5" rx="12"/><text x="830" y="250" class="side-title">Schema Layer</text><g class="box-text"><text y="0" transform="translate(830, 275)">• Cloud &amp; Service</text><text y="24" transform="translate(830, 275)">• Dynamic Fields</text><text y="48" transform="translate(830, 275)">• Supported Actions</text><text y="72" transform="translate(830, 275)">• Filter Definitions</text><text y="96" transform="translate(830, 275)">• Column Layouts</text><text y="120" transform="translate(830, 275)">• Custom Inspectors</text></g><rect width="580" height="110" x="210" y="100" fill="url(#webGrad)" stroke="#3b82f6" stroke-width="2" rx="12"/><text x="230" y="130" fill="#60a5fa" class="box-title">harshify-web (React + Vite + TS)</text><g class="box-text"><text y="0" transform="translate(230, 155)">• Cloud selector: AWS, Azure, GCP</text><text y="20" transform="translate(230, 155)">• Service explorer: Storage, Databases, Serverless, Compute, Networking, Security</text><text y="40" transform="translate(230, 155)">• DynamicResourceView renders tables, forms, and inspectors dynamically from API schema</text></g><rect width="580" height="110" x="210" y="250" fill="url(#proxyGrad)" stroke="#8b5cf6" stroke-width="2" rx="12"/><text x="230" y="280" fill="#a78bfa" class="box-title">Harshify API Proxy (Bun + Hono)</text><g class="box-text"><text y="0" transform="translate(230, 305)">• Unified client entrypoint serving /api/clouds/... and /api/system/...</text><text y="20" transform="translate(230, 305)">• CloudProxyService intercepts and routes requests via CloudAdapterRegistry</text><text y="40" transform="translate(230, 305)">• Translates provider-neutral contracts into specific cloud SDK / HTTP operations</text></g><rect width="580" height="110" x="210" y="400" fill="url(#registryGrad)" stroke="#10b981" stroke-width="2" rx="12"/><text x="230" y="430" fill="#34d399" class="box-title">Cloud Adapter Registry &amp; SPI</text><g class="box-text"><text y="0" transform="translate(230, 455)">• ServiceCatalog: Unified catalog of available services and providers</text><text y="20" transform="translate(230, 455)">• CloudServiceAdapter SPI: Common interfaces implemented by each provider</text><text y="40" transform="translate(230, 455)">• Dynamic schema loading and capability verification check</text></g><rect width="180" height="95" x="210" y="550" fill="url(#awsGrad)" stroke="#f90" stroke-width="1.5" rx="10"/><text x="225" y="575" fill="#ffb84d" class="box-title" style="font-size:13px">AWS Adapters</text><text x="225" y="598" class="box-text">S3, Lambda, EC2,</text><text x="225" y="618" class="box-text">RDS, EKS, Secrets</text><rect width="180" height="70" x="210" y="680" fill="#1e1b18" stroke="#f90" stroke-opacity=".4" stroke-width="1" rx="10"/><text x="225" y="705" class="box-title" style="font-size:13px">Harshify AWS Core</text><text x="225" y="728" fill="#9ca3af" class="box-text">localhost:4566</text><rect width="180" height="95" x="410" y="550" fill="url(#azureGrad)" stroke="#0078d4" stroke-width="1.5" rx="10"/><text x="425" y="575" fill="#39f" class="box-title" style="font-size:13px">Azure Adapters</text><text x="425" y="598" class="box-text">Blob, Cosmos DB,</text><text x="425" y="618" class="box-text">Key Vault, Functions</text><rect width="180" height="70" x="410" y="680" fill="#181c24" stroke="#0078d4" stroke-opacity=".4" stroke-width="1" rx="10"/><text x="425" y="705" class="box-title" style="font-size:13px">Harshify-AZ (Azure)</text><text x="425" y="728" fill="#9ca3af" class="box-text">localhost:4577</text><rect width="180" height="95" x="610" y="550" fill="url(#gcpGrad)" stroke="#34a853" stroke-width="1.5" rx="10"/><text x="625" y="575" fill="#5cd67d" class="box-title" style="font-size:13px">GCP Adapters</text><text x="625" y="598" class="box-text">GCS, Cloud SQL,</text><text x="625" y="618" class="box-text">Cloud Functions, GKE</text><rect width="180" height="70" x="610" y="680" fill="#18201a" stroke="#34a853" stroke-opacity=".4" stroke-width="1" rx="10"/><text x="625" y="705" class="box-title" style="font-size:13px">Harshify-GCP</text><text x="625" y="728" fill="#9ca3af" class="box-text">localhost:4588</text><line x1="500" x2="500" y1="210" y2="242" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/><line x1="500" x2="500" y1="360" y2="392" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/><path fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)" d="M 400 510 L 300 510 L 300 542"/><line x1="500" x2="500" y1="510" y2="542" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/><path fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)" d="M 600 510 L 700 510 L 700 542"/><line x1="300" x2="300" y1="645" y2="672" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/><line x1="500" x2="500" y1="645" y2="672" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/><line x1="700" x2="700" y1="645" y2="672" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/></svg>