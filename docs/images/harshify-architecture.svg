<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <!-- Component Box Gradients -->
    <linearGradient id="webGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="proxyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="registryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Provider Gradients -->
    <linearGradient id="awsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#cc7a00" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="azureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#005a9e" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="gcpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34a853" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#25823c" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Side Panel Gradients -->
    <linearGradient id="sideGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4b5563"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 24px; font-weight: 800; fill: #f3f4f6; text-anchor: middle; letter-spacing: 0.5px; }
    .subtitle { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13px; fill: #9ca3af; text-anchor: middle; }
    .box-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #f3f4f6; }
    .box-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 12px; fill: #d1d5db; line-height: 1.5; }
    .side-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #9ca3af; }
    .arrow-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #6b7280; text-anchor: middle; }
  </style>

  <!-- Background -->
  <rect width="1000" height="800" fill="url(#bgGrad)"/>
  <rect width="1000" height="800" fill="none" stroke="#1f2937" stroke-width="1"/>

  <!-- Title Section -->
  <text x="500" y="45" class="title">Harshify Unified Multi-Cloud Architecture</text>
  <text x="500" y="68" class="subtitle">Clean, schema-driven multi-cloud local runtime console</text>

  <!-- Left Principle Panel -->
  <rect x="25" y="220" width="160" height="280" rx="12" fill="url(#sideGrad)" stroke="#374151" stroke-width="1.5"/>
  <text x="40" y="250" class="side-title">Principles</text>
  <g class="box-text" transform="translate(40, 275)">
    <text y="0">• UI doesn't know clouds</text>
    <text y="24">• Proxy doesn't know</text>
    <text y="40">  internal runtimes</text>
    <text y="64">• SPI defines contracts</text>
    <text y="88">• Adapters translate</text>
    <text y="112">• Harshify runtimes</text>
    <text y="128">  execute behavior</text>
  </g>

  <!-- Right Schema Panel -->
  <rect x="815" y="220" width="160" height="280" rx="12" fill="url(#sideGrad)" stroke="#374151" stroke-width="1.5"/>
  <text x="830" y="250" class="side-title">Schema Layer</text>
  <g class="box-text" transform="translate(830, 275)">
    <text y="0">• Cloud &amp; Service</text>
    <text y="24">• Dynamic Fields</text>
    <text y="48">• Supported Actions</text>
    <text y="72">• Filter Definitions</text>
    <text y="96">• Column Layouts</text>
    <text y="120">• Custom Inspectors</text>
  </g>

  <!-- Main Web Frontend Box -->
  <rect x="210" y="100" width="580" height="110" rx="12" fill="url(#webGrad)" stroke="#3b82f6" stroke-width="2"/>
  <text x="230" y="130" class="box-title" fill="#60a5fa">harshify-web (React + Vite + TS)</text>
  <g class="box-text" transform="translate(230, 155)">
    <text y="0">• Cloud selector: AWS, Azure, GCP</text>
    <text y="20">• Service explorer: Storage, Databases, Serverless, Compute, Networking, Security</text>
    <text y="40">• DynamicResourceView renders tables, forms, and inspectors dynamically from API schema</text>
  </g>

  <!-- Main Proxy API Box -->
  <rect x="210" y="250" width="580" height="110" rx="12" fill="url(#proxyGrad)" stroke="#8b5cf6" stroke-width="2"/>
  <text x="230" y="280" class="box-title" fill="#a78bfa">Harshify API Proxy (Bun + Hono)</text>
  <g class="box-text" transform="translate(230, 305)">
    <text y="0">• Unified client entrypoint serving /api/clouds/... and /api/system/...</text>
    <text y="20">• CloudProxyService intercepts and routes requests via CloudAdapterRegistry</text>
    <text y="40">• Translates provider-neutral contracts into specific cloud SDK / HTTP operations</text>
  </g>

  <!-- Registry / SPI Box -->
  <rect x="210" y="400" width="580" height="110" rx="12" fill="url(#registryGrad)" stroke="#10b981" stroke-width="2"/>
  <text x="230" y="430" class="box-title" fill="#34d399">Cloud Adapter Registry &amp; SPI</text>
  <g class="box-text" transform="translate(230, 455)">
    <text y="0">• ServiceCatalog: Unified catalog of available services and providers</text>
    <text y="20">• CloudServiceAdapter SPI: Common interfaces implemented by each provider</text>
    <text y="40">• Dynamic schema loading and capability verification check</text>
  </g>

  <!-- Bottom Row: Adapters & Runtimes -->
  
  <!-- AWS Adapter & Runtime -->
  <rect x="210" y="550" width="180" height="95" rx="10" fill="url(#awsGrad)" stroke="#ff9900" stroke-width="1.5"/>
  <text x="225" y="575" class="box-title" fill="#ffb84d" style="font-size: 13px;">AWS Adapters</text>
  <text x="225" y="598" class="box-text">S3, Lambda, EC2,</text>
  <text x="225" y="618" class="box-text">RDS, EKS, Secrets</text>

  <rect x="210" y="680" width="180" height="70" rx="10" fill="#1e1b18" stroke="#ff9900" stroke-opacity="0.4" stroke-width="1"/>
  <text x="225" y="705" class="box-title" style="font-size: 13px;">Harshify AWS Core</text>
  <text x="225" y="728" class="box-text" fill="#9ca3af">localhost:4566</text>

  <!-- Azure Adapter & Runtime -->
  <rect x="410" y="550" width="180" height="95" rx="10" fill="url(#azureGrad)" stroke="#0078d4" stroke-width="1.5"/>
  <text x="425" y="575" class="box-title" fill="#3399ff" style="font-size: 13px;">Azure Adapters</text>
  <text x="425" y="598" class="box-text">Blob, Cosmos DB,</text>
  <text x="425" y="618" class="box-text">Key Vault, Functions</text>

  <rect x="410" y="680" width="180" height="70" rx="10" fill="#181c24" stroke="#0078d4" stroke-opacity="0.4" stroke-width="1"/>
  <text x="425" y="705" class="box-title" style="font-size: 13px;">Harshify-AZ (Azure)</text>
  <text x="425" y="728" class="box-text" fill="#9ca3af">localhost:4577</text>

  <!-- GCP Adapter & Runtime -->
  <rect x="610" y="550" width="180" height="95" rx="10" fill="url(#gcpGrad)" stroke="#34a853" stroke-width="1.5"/>
  <text x="625" y="575" class="box-title" fill="#5cd67d" style="font-size: 13px;">GCP Adapters</text>
  <text x="625" y="598" class="box-text">GCS, Cloud SQL,</text>
  <text x="625" y="618" class="box-text">Cloud Functions, GKE</text>

  <rect x="610" y="680" width="180" height="70" rx="10" fill="#18201a" stroke="#34a853" stroke-opacity="0.4" stroke-width="1"/>
  <text x="625" y="705" class="box-title" style="font-size: 13px;">Harshify-GCP</text>
  <text x="625" y="728" class="box-text" fill="#9ca3af">localhost:4588</text>

  <!-- Connecting Arrows -->
  
  <!-- Web -> Proxy -->
  <line x1="500" y1="210" x2="500" y2="242" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Proxy -> Registry -->
  <line x1="500" y1="360" x2="500" y2="392" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Registry -> Adapters -->
  <!-- To AWS -->
  <path d="M 400 510 L 300 510 L 300 542" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- To Azure -->
  <line x1="500" y1="510" x2="500" y2="542" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- To GCP -->
  <path d="M 600 510 L 700 510 L 700 542" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Adapters -> Runtimes -->
  <line x1="300" y1="645" x2="300" y2="672" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="645" x2="500" y2="672" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="645" x2="700" y2="672" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
